<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spotilung">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#060a12" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Spotilung</title>
<style>
:root{--navy:#0b1f3a;--gold:#c9a24b;--bg:#fff;--fg:#0a0a0a;--mute:#6b7280;--line:#ececec;--field:#f4f4f5;--hi:var(--navy);--chip:var(--navy)}
@media (prefers-color-scheme:dark){:root{--bg:#060a12;--fg:#f2f2f2;--mute:#9aa3b2;--line:#1b2333;--field:#121a28;--hi:var(--gold);--chip:#16305a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:env(safe-area-inset-top) 20px calc(96px + env(safe-area-inset-bottom));background:var(--bg);color:var(--fg);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  /* rasa aplikasi asli: tanpa pinch/ketuk-dua-kali zoom, tanpa blok teks saat ditekan lama */
  touch-action:pan-x pan-y;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
input{-webkit-user-select:text;user-select:text}
img{-webkit-touch-callout:none;-webkit-user-drag:none}
button{font:inherit;border:0;background:none;color:inherit;padding:0;cursor:pointer;user-select:none;-webkit-user-select:none}
button:disabled{opacity:.5}
svg{width:24px;height:24px;fill:currentColor;display:block}
h1,h2{font-family:Didot,"Bodoni 72",Georgia,serif;font-weight:400;margin:0}
header{display:flex;align-items:center;justify-content:space-between;padding:24px 0 16px}
h1{font-size:34px;letter-spacing:.5px}
h1::after{content:"";display:block;width:36px;height:2px;background:var(--gold);margin-top:4px}
.round{width:44px;height:44px;border-radius:50%;background:var(--chip);color:var(--gold);display:grid;place-items:center;position:relative;cursor:pointer}
.round input,.chip input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
#q{width:100%;border:0;border-radius:12px;background:var(--field);padding:12px 14px;font-size:16px;color:var(--fg);-webkit-appearance:none}
nav{display:flex;gap:8px;margin:14px -20px 4px;padding:0 20px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;padding:8px 18px;border-radius:99px;border:1px solid var(--line);font-size:14px;min-height:40px}
nav .on{background:var(--chip);border-color:var(--chip);color:#fff}
#tools{display:flex;align-items:center;justify-content:space-between;color:var(--mute);font-size:13px;min-height:36px}
#tools[hidden],#plbar[hidden],[hidden]{display:none!important}
#sort{border:0;background:none;color:var(--fg);font:inherit;font-size:13px;padding:8px 0;-webkit-appearance:none;appearance:none;text-align:right}
#plbar{display:flex;align-items:center;gap:4px;margin:6px 0 0}
#plbar h2{flex:1;min-width:0;font-size:24px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#plbar button{flex:none;width:44px;height:44px;display:grid;place-items:center;color:var(--hi)}
#back{margin-left:-10px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 0;text-align:left}
.art{flex:none;width:44px;height:44px;border-radius:8px;overflow:hidden;background:var(--chip);color:var(--gold);display:grid;place-items:center}
.art img,#cover img{width:100%;height:100%;object-fit:cover;display:block}
.tx{min-width:0;display:grid}
.tx b,.tx small,#mt{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tx b{font-weight:500}
.tx small{color:var(--mute);font-size:13px}
.cur .art{background:var(--gold);color:var(--navy)}
.cur b{font-weight:700;color:var(--hi)}
.fav,.more,.del{flex:none;width:40px;height:44px;display:grid;place-items:center;color:var(--mute)}
.fav.on{color:var(--gold)}
#empty{color:var(--mute);text-align:center;padding:56px 16px}
#ver{color:var(--mute);text-align:center;font-size:12px;margin:24px 0 0}
#ver.warn{color:var(--gold);font-weight:600}
dialog{border:0;border-radius:16px;padding:20px;width:min(360px,calc(100vw - 32px));max-height:85vh;overflow-y:auto;background:var(--bg);color:var(--fg)}
dialog::backdrop{background:rgba(6,10,18,.6)}
dialog.sheet{margin:auto 0 0;width:100%;max-width:none;border-radius:20px 20px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
dialog h2{font-size:22px;margin-bottom:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.opts button{width:100%;min-height:50px;text-align:left;border-bottom:1px solid var(--line)}
.opts li{border:0}
.opts .new{color:var(--hi);font-weight:600}
.opts .danger{color:#c0392b}
.opts .cur button{color:var(--hi);font-weight:700}
.wide{margin-top:14px;width:100%;min-height:44px;border-radius:99px;background:var(--chip);color:#fff}
.edtop{display:flex;gap:14px;align-items:center;margin:10px 0 4px}
.edtop .art{width:88px;height:88px;border-radius:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);font-size:14px;cursor:pointer}
.fld{display:block;font-size:13px;color:var(--mute);margin-top:12px}
.fld input{display:block;width:100%;margin-top:4px;border:0;border-radius:10px;background:var(--field);color:var(--fg);padding:11px 12px;font-size:16px}
.sub{font-size:13px;color:var(--mute);margin:16px 0 8px}
#edmsg{font-size:13px;color:var(--gold);min-height:1.2em;margin:10px 0 0}
.row2{display:flex;gap:10px;margin-top:12px}
.row2 button{flex:1;min-height:44px;border-radius:99px;border:1px solid var(--line)}
.row2 .pri{background:var(--chip);border-color:var(--chip);color:#fff}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);
  padding:10px 16px;border-radius:18px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;
  width:max-content;max-width:calc(100vw - 32px);text-align:center}
#toast.on{opacity:1}
#mini{position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:#fff;display:flex;align-items:center;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom)) 20px;border-top:2px solid var(--gold)}
#mt{flex:1;text-align:left;min-height:48px}
#mini .b{width:48px;height:48px;display:grid;place-items:center;color:var(--gold)}
#np{position:fixed;inset:0;background:var(--navy);color:#fff;display:flex;flex-direction:column;
  padding:calc(8px + env(safe-area-inset-top)) 28px calc(28px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .3s ease;
  touch-action:none;overscroll-behavior:contain} /* geseran di pemutar tidak menggulir daftar di belakangnya */
#lyr{touch-action:pan-y}
#np.open{transform:none}
@media (prefers-reduced-motion:reduce){#np{transition:none}}
.top{display:flex;align-items:center;margin:0 -12px}
.top .sp{flex:1}
.top button{width:46px;height:48px;display:grid;place-items:center;align-content:center}
.tg{color:rgba(255,255,255,.5)}
.tg[aria-pressed=true]{color:var(--gold)}
#sleepl{font-size:10px;line-height:1}
#stage{flex:1;min-height:0;display:grid;place-items:center;position:relative;margin:8px 0}
#cover{width:min(260px,64vw);aspect-ratio:1;border-radius:16px;overflow:hidden;border:1px solid var(--gold);background:rgba(255,255,255,.05);color:var(--gold);display:grid;place-items:center}
#cover svg{width:96px;height:96px}
video{width:100%;max-height:50vh;border-radius:12px;background:#000}
#np.video #cover{display:none}
/* audio: elemen video tetap ada (dipakai sebagai pemutar) tapi tak terlihat */
#np:not(.video) video{position:absolute;width:1px;height:1px;opacity:0}
#lyr{display:none;position:absolute;inset:0;overflow-y:auto;padding:35% 0;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
#lyr::-webkit-scrollbar{display:none}
#np.lyr #lyr{display:block}
#lyroff{position:absolute;left:50%;bottom:0;transform:translateX(-50%);display:flex;align-items:center;gap:2px;
  background:rgba(255,255,255,.1);border-radius:99px;padding:2px;font-size:13px;white-space:nowrap}
#np:not(.lyr) #lyroff{display:none}
#lyroff button{width:40px;height:36px;font-size:22px;line-height:1;color:var(--gold)}
#lyroff .t{width:auto;padding:0 12px;font-size:13px;font-weight:600;border-radius:99px}
#lyrsync{background:rgba(201,162,75,.18)}
#lyroff.syncing .n,#lyroff:not(.syncing) .s{display:none}
#lyroff.syncing #lyrv{padding:0 6px 0 12px}
#np.lyr #lyr p{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
#np.lyr #cover{visibility:hidden}
#lyr p{margin:0 0 16px;font-size:22px;font-weight:650;line-height:1.3;color:rgba(255,255,255,.35);transition:color .25s;cursor:pointer}
#lyr p.on,#lyr.plain p{color:#fff}
#lyr.plain p{font-size:18px;font-weight:500;cursor:auto}
#lyr .hint{font-size:16px;font-weight:400;color:rgba(255,255,255,.65);text-align:center;cursor:auto}
#t{font-size:26px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#a{margin:2px 0 14px;color:rgba(255,255,255,.65);min-height:1.4em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#seek{-webkit-appearance:none;appearance:none;width:100%;height:32px;margin:0;background:none;--p:0%}
#seek::-webkit-slider-runnable-track{height:4px;border-radius:2px;
  background:linear-gradient(var(--gold),var(--gold)) 0/var(--p) 100% no-repeat,rgba(255,255,255,.2)}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;background:var(--gold);border:0}
.times{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.65);font-variant-numeric:tabular-nums}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.ctl button{width:48px;height:48px;display:grid;place-items:center}
.ctl svg{width:30px;height:30px}
#pp{width:68px;height:68px;border-radius:50%;background:var(--gold);color:var(--navy)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1>Spotilung</h1>
  <label class="round" data-ic="plus"></label>
</header>
<input id="q" type="search" placeholder="Cari judul, artis, atau album" aria-label="Cari">
<nav>
  <button data-f="all" class="on">Semua</button>
  <button data-f="fav">Favorit</button>
  <button data-f="pl">Playlist</button>
  <button data-f="artist">Artis</button>
  <button data-f="album">Album</button>
</nav>
<div id="plbar" hidden>
  <button id="back" aria-label="Kembali" data-ic="back"></button>
  <h2 id="pln"></h2>
  <button id="pldel" aria-label="Hapus playlist" data-ic="trash"></button>
</div>
<div id="tools">
  <span id="count"></span>
  <select id="sort" aria-label="Urutkan">
    <option value="title">Urut: Judul ▾</option>
    <option value="artist">Urut: Artis ▾</option>
    <option value="new">Urut: Terbaru ▾</option>
  </select>
</div>
<ul id="list"></ul>
<p id="empty"></p>
<p id="ver"></p>

<dialog id="pick" class="sheet" aria-labelledby="pickh">
  <h2 id="pickh">Tambah ke playlist</h2>
  <ul id="picks" class="opts"></ul>
</dialog>

<dialog id="menu" class="sheet" aria-labelledby="mh">
  <h2 id="mh"></h2>
  <ul id="mlist" class="opts"></ul>
</dialog>

<dialog id="qd" class="sheet" aria-labelledby="qh">
  <h2 id="qh">Antrean</h2>
  <ul id="qlist"></ul>
</dialog>

<dialog id="sd" class="sheet" aria-labelledby="sh">
  <h2 id="sh">Timer tidur</h2>
  <ul id="slist" class="opts">
    <li><button data-m="15">15 menit</button></li>
    <li><button data-m="30">30 menit</button></li>
    <li><button data-m="45">45 menit</button></li>
    <li><button data-m="60">1 jam</button></li>
    <li><button data-m="end">Akhir lagu ini</button></li>
    <li><button data-m="0">Matikan timer</button></li>
  </ul>
</dialog>

<dialog id="ed" aria-labelledby="edh">
  <h2 id="edh">Edit lagu</h2>
  <div class="edtop">
    <span class="art" id="edart"></span>
    <div class="chips">
      <label class="chip">Pilih foto<input id="edimg" type="file" accept="image/*" aria-label="Pilih foto cover"></label>
      <button class="chip" id="edfind">Cari otomatis</button>
      <button class="chip" id="edrm">Hapus</button>
    </div>
  </div>
  <label class="fld">Judul<input id="edt" autocomplete="off"></label>
  <label class="fld">Artis<input id="eda" autocomplete="off"></label>
  <label class="fld">Album<input id="edal" autocomplete="off"></label>
  <p class="sub" id="edls"></p>
  <div class="chips">
    <button class="chip" id="edlfind">Cari lirik</button>
    <label class="chip">Berkas .lrc<input id="edlrc" type="file" aria-label="Pilih berkas lirik"></label>
    <button class="chip" id="edlrm">Hapus lirik</button>
  </div>
  <p id="edmsg" role="status"></p>
  <div class="row2"><button id="edx">Batal</button><button id="eds" class="pri">Simpan</button></div>
</dialog>

<div id="mini" hidden>
  <button id="mt" aria-label="Buka pemutar"></button>
  <button class="b" id="mpp" aria-label="Putar atau jeda"></button>
  <button class="b" id="mnext" aria-label="Berikutnya" data-ic="next"></button>
</div>

<section id="np" inert>
  <div class="top">
    <button id="close" aria-label="Tutup pemutar" data-ic="down"></button>
    <span class="sp"></span>
    <button class="tg" id="lyrb" aria-label="Lirik" aria-pressed="false" data-ic="lyrics"></button>
    <button class="tg" id="qb" aria-label="Antrean" data-ic="queue"></button>
    <button class="tg" id="sleep" aria-label="Timer tidur" aria-pressed="false"></button>
    <button class="tg" id="npmore" aria-label="Pilihan lagu ini" data-ic="more"></button>
  </div>
  <div id="stage">
    <div id="cover"></div>
    <video id="v" playsinline></video>
    <div id="lyr"></div>
    <div id="lyroff" hidden>
      <button id="lyrm" class="n" aria-label="Majukan bagian lirik ini 0,5 detik">−</button>
      <span id="lyrv" aria-live="polite"></span>
      <button id="lyrp" class="n" aria-label="Mundurkan bagian lirik ini 0,5 detik">+</button>
      <button id="lyrreset" class="t s">Atur ulang</button>
      <button id="lyrsync" class="t"></button>
    </div>
  </div>
  <h2 id="t"></h2>
  <p id="a"></p>
  <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Posisi lagu">
  <div class="times"><span id="ct">0:00</span><span id="du">0:00</span></div>
  <div class="ctl">
    <button class="tg" id="shuf" aria-label="Acak" aria-pressed="false" data-ic="shuffle"></button>
    <button id="prev" aria-label="Sebelumnya" data-ic="prev"></button>
    <button id="pp" aria-label="Putar atau jeda"></button>
    <button id="next" aria-label="Berikutnya" data-ic="next"></button>
    <button class="tg" id="rep" aria-label="Ulangi: mati" aria-pressed="false"></button>
  </div>
</section>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const VERSION = 'v9';
const P = {
  play: 'M8 5v14l11-7z', pause: 'M6 5h4v14H6zM14 5h4v14h-4z',
  next: 'M6 6l8.5 6L6 18zM16 6h2v12h-2z', prev: 'M18 6l-8.5 6L18 18zM6 6h2v12H6z',
  plus: 'M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z', down: 'M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z',
  back: 'M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z',
  x: 'M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z',
  note: 'M12 3v10.55A4 4 0 1014 17V7h4V3h-6z',
  video: 'M17 10.5V7a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h12a1 1 0 001-1v-3.5l4 4v-11l-4 4z',
  list: 'M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z',
  more: 'M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z',
  queue: 'M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z',
  lyrics: 'M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z',
  moon: 'M12.34 2.02C6.59 1.82 2 6.42 2 12c0 5.52 4.48 10 10 10 3.71 0 6.93-2.02 8.66-5.02-7.51-.25-12.09-8.43-8.32-14.96z',
  person: 'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z',
  album: 'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5zm0-5.5c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z',
  heart: 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z',
  trash: 'M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z',
  shuffle: 'M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z',
  repeat: 'M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z',
  repeat1: 'M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z'
};
const ic = n => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${P[n]}"/></svg>`;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const fmt = s => isFinite(s) ? `${s / 60 | 0}:${String(s % 60 | 0).padStart(2, '0')}` : '0:00';
const fmtBytes = n => n >= 1e9 ? `${(n / 1e9).toFixed(1)} GB` : `${Math.round(n / 1e6)} MB`;
const wait = ms => new Promise(r => setTimeout(r, ms));
// "Artis - Judul.mp3" -> [judul, artis]
const split = n => { const i = n.indexOf(' - '); return i > 0 ? [n.slice(i + 3), n.slice(0, i)] : [n, '']; };
// tag/edit menang, nama berkas sebagai cadangan

// LRCLIB (gratis, tanpa kunci). Yang dikirim hanya judul + artis, dan hanya saat panel lirik dibuka.
async function fetchLyrics(title, artist, dur) {
  [title, artist] = [clean(title), clean(artist)];
  const qs = artist ? `track_name=${encodeURIComponent(title)}&artist_name=${encodeURIComponent(artist)}` : `q=${encodeURIComponent(title)}`;
  const r = await fetch(`https://lrclib.net/api/search?${qs}`);
  if (!r.ok) throw new Error(r.status);
  const ok = (await r.json()).filter(x => sameTitle(title, x.trackName) && (!artist || sameTitle(artist, x.artistName)));
  // satu lagu bisa punya beberapa versi (album, video klip, live) dengan waktu berbeda: ambil yang durasinya paling dekat
  const gap = x => isFinite(dur) && x.duration ? Math.abs(x.duration - dur) : 999;
  const pick = ok.filter(x => x.syncedLyrics).sort((a, b) => gap(a) - gap(b))[0] || ok.find(x => x.plainLyrics);
  return pick ? pick.syncedLyrics || pick.plainLyrics : null;
}

console.assert(effTimes([{t: 1}, {t: 2}, {t: 3}, {t: 4}], [{i: 0, off: -1}, {i: 2, off: 5}]).join() === '0,1,8,9', 'effTimes');
const calcEff = () => { eff = effTimes(lines, anchors(now())); };
const segment = () => anchors(now()).filter(a => a.i <= Math.max(lineI, 0)).pop();
function paintOff() {
  $('#lyroff').classList.toggle('syncing', syncMode);
  $('#lyrsync').textContent = syncMode ? 'Selesai' : 'Sinkron';
  const o = segment()?.off || 0;
  $('#lyrv').textContent = syncMode ? 'Mode sinkron'
    : o ? `Lirik ${o > 0 ? '+' : '−'}${String(Math.abs(o)).replace('.', ',')} dtk` : anchors(now()).length ? 'Lirik pas' : 'Belum pas? Ketuk Sinkron';
}
function setAnchors(list) {
  const t = now();
  delete t.lyrOffset;
  if (list.length) t.lyrSync = list.sort((a, b) => a.i - b.i); else delete t.lyrSync;
  put(t); calcEff(); lineI = -2; syncLyrics(); paintOff();
}
const clearSync = t => { delete t.lyrOffset; delete t.lyrSync; };
// − / + menggeser bagian lirik yang sedang aktif saja
function shiftLyrics(d) {
  const a = anchors(now()).map(x => ({...x}));
  let seg = a.filter(x => x.i <= Math.max(lineI, 0)).pop();
  if (!seg) a.push(seg = {i: 0, off: 0});
  seg.off = Math.round((seg.off + d) * 10) / 10;
  setAnchors(a.filter(x => x.i || x.off));
}
$('#lyrm').onclick = () => shiftLyrics(-0.5);
$('#lyrp').onclick = () => shiftLyrics(0.5);
$('#lyrsync').onclick = () => {
  syncMode = !syncMode;
  paintOff();
  if (syncMode) toast('Ketuk tiap baris tepat saat mulai dinyanyikan. Cukup baris pertama dan baris pertama setelah jeda.');
};
$('#lyrreset').onclick = () => { setAnchors([]); toast('Sinkron lirik diatur ulang'); };
function syncLyrics() {
  if (!lyrOn || !lines.length || lines[0].t == null) return;
  const i = eff.findLastIndex(e => e <= v.currentTime + 0.25);
  if (i === lineI) return;
  const box = $('#lyr'), seg = segment();
  box.querySelector('.on')?.classList.remove('on');
  lineI = i;
  if (segment() !== seg) paintOff(); // label ikut bagian lirik yang sedang aktif
  const el = box.children[i];
  if (!el) return;
  el.classList.add('on');
  // scroll manual (bukan scrollIntoView) supaya halaman di belakang pemutar tidak ikut bergeser
  box.scrollTo({top: el.offsetTop - box.clientHeight / 2 + el.offsetHeight / 2, behavior: 'smooth'});
}
function toggleLyrics() {
  lyrOn = !lyrOn;
  syncMode = false;
  np.classList.toggle('lyr', lyrOn);
  $('#lyrb').setAttribute('aria-pressed', lyrOn);
  if (lyrOn) showLyrics();
}
$('#lyr').onclick = e => {
  const j = +e.target.closest('p[data-i]')?.dataset.i;
  if (!(j >= 0) || lines[j].t == null) return;
  if (syncMode) {
    setAnchors([...anchors(now()).filter(a => a.i !== j), {i: j, off: Math.round((v.currentTime - lines[j].t) * 10) / 10}]);
    toast(`Baris ${j + 1} disinkronkan`);
  } else { v.currentTime = Math.max(0, eff[j]); lineI = -2; syncLyrics(); }
};

// ---------- Tombol & menu ----------
$('#pp').onclick = $('#mpp').onclick = toggle;
$('#next').onclick = $('#mnext').onclick = () => next();
$('#prev').onclick = prev;
$('#mt').onclick = () => sheet(true);
$('#close').onclick = () => sheet(false);
$('#shuf').onclick = () => setShuffle(!shuffle);
$('#rep').onclick = () => { repeat = (repeat + 1) % 3; paintRepeat(); saveState(); };
$('#lyrb').onclick = toggleLyrics;
$('#sleep').onclick = () => $('#sd').showModal();
$('#npmore').onclick = () => now() && openMenu(now(), true);
$('#q').oninput = render;
$('#sort').onchange = e => { sortBy = e.target.value; saveState(); render(); };
$('nav').onclick = e => e.target.dataset.f && go(e.target.dataset.f);
$('#back').onclick = () => { pl = null; grp = null; render(); };
$('#pldel').onclick = async () => {
  if (!confirm(`Hapus playlist "${pl.name}"? Lagunya tetap ada di pustaka.`)) return;
  await req(store('playlists', 'readwrite').delete(pl.id));
  playlists = playlists.filter(p => p !== pl); pl = null;
  render();
};
if (ms) {
  ms.setActionHandler('play', () => v.play());
  ms.setActionHandler('pause', () => v.pause());
  ms.setActionHandler('previoustrack', prev);
  ms.setActionHandler('nexttrack', () => next());
  ms.setActionHandler('seekto', d => { v.currentTime = d.seekTime; });
}
// ketuk di luar lembar pilihan untuk menutupnya
document.querySelectorAll('dialog').forEach(d => d.addEventListener('click', e => {
  const r = d.getBoundingClientRect();
  if (e.target === d && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)) d.close();
}));

$('#list').onclick = async e => {
  const b = e.target.closest('button'), li = b?.closest('li');
  if (!b) return;
  if ('new' in li.dataset) { await newPlaylist([]); return render(); }
  if (li.dataset.pl) { pl = playlists.find(p => p.id === +li.dataset.pl); $('#q').value = ''; return render(); }
  if (li.dataset.g != null) { grp = li.dataset.g; $('#q').value = ''; return render(); }
  const t = byId(+li.dataset.id);
  if (b.classList.contains('main')) startQueue(visible(), t);
  else if (b.classList.contains('fav')) { t.fav = !t.fav; await put(t); render(); }
  else openMenu(t, false);
};

function openMenu(t, fromPlayer) {
  menuT = t;
  $('#mh').textContent = info(t)[0];
  const items = [['next', 'Putar berikutnya'], ['queue', 'Tambah ke antrean'], ['pl', 'Tambah ke playlist'],
    ['artist', 'Lihat artis'], t.album && ['album', 'Lihat album'], ['edit', 'Edit info, cover & lirik'],
    pl && !fromPlayer && ['out', 'Keluarkan dari playlist'], ['del', 'Hapus dari Spotilung']].filter(Boolean);
  $('#mlist').innerHTML = items.map(([a, l]) => `<li><button data-a="${a}" class="${a === 'del' ? 'danger' : ''}">${l}</button></li>`).join('');
  $('#menu').showModal();
}
$('#mlist').onclick = async e => {
  const a = e.target.closest('button')?.dataset.a, t = menuT;
  if (!a) return;
  $('#menu').close();
  if (a === 'next' || a === 'queue') { const was = !!now(); enqueue(t, a === 'next'); if (was) toast(a === 'next' ? 'Diputar berikutnya' : 'Ditambahkan ke antrean'); }
  else if (a === 'pl') openPick(t);
  else if (a === 'artist' || a === 'album') { sheet(false); go(a, keyOf(a, t)); }
  else if (a === 'edit') openEdit(t);
  else if (a === 'out') { pl.ids = pl.ids.filter(id => id !== t.id); await putPl(pl); render(); }
  else if (a === 'del') removeTrack(t);
};

async function removeTrack(t) {
  if (!confirm(`Hapus "${info(t)[0]}" dari Spotilung?`)) return;
  const tx = db.transaction(['tracks', 'blobs', 'playlists'], 'readwrite');
  tx.objectStore('tracks').delete(t.id); tx.objectStore('blobs').delete(t.id);
  for (const p of playlists) if (p.ids.includes(t.id)) { p.ids = p.ids.filter(id => id !== t.id); tx.objectStore('playlists').put(p); }
  await done(tx);
  dropCover(t);
  const n = now();
  tracks = tracks.filter(x => x !== t);
  queue = queue.filter(x => x !== t);
  orig = orig.filter(x => x !== t);
  cur = queue.indexOf(n);
  if (n === t) { v.pause(); v.removeAttribute('src'); v.load(); $('#mini').hidden = true; sheet(false); }
  saveState(); render(); storageInfo();
}

function showQueue() {
  $('#qlist').innerHTML = queue.map((t, i) => i < cur ? '' : `<li data-i="${i}" class="${i === cur ? 'cur' : ''}">
    <button class="main"><span class="art">${art(t)}</span><span class="tx"><b>${esc(info(t)[0])}</b>
      <small>${i === cur ? 'Sedang diputar' : esc(info(t)[1] || 'Audio')}</small></span></button>
    ${i === cur ? '' : `<button class="del" aria-label="Keluarkan ${esc(info(t)[0])} dari antrean">${ic('x')}</button>`}</li>`).join('')
    || '<li><p class="sub">Antrean kosong.</p></li>';
  if (!$('#qd').open) $('#qd').showModal();
}
$('#qb').onclick = showQueue;
$('#qlist').onclick = e => {
  const b = e.target.closest('button'), i = +b?.closest('li').dataset.i;
  if (!b) return;
  if (b.classList.contains('del')) { queue.splice(i, 1); saveState(); showQueue(); }
  else { $('#qd').close(); if (i !== cur) load(i); }
};

async function newPlaylist(ids) {
  const name = prompt('Nama playlist')?.trim();
  if (!name) return;
  const p = {name, ids};
  p.id = await req(store('playlists', 'readwrite').add(p));
  playlists.push(p);
  return p;
}
function openPick(t) {
  addTo = t;
  $('#picks').innerHTML = `<li><button class="new">+ Playlist baru</button></li>` +
    playlists.map(p => `<li><button data-pl="${p.id}">${esc(p.name)}${p.ids.includes(t.id) ? ' ✓' : ''}</button></li>`).join('');
  $('#pick').showModal();
}
$('#picks').onclick = async e => {
  const b = e.target.closest('button');
  if (!b) return;
  $('#pick').close();
  if (b.classList.contains('new')) { if (await newPlaylist([addTo.id])) toast('Playlist dibuat'); }
  else {
    const p = playlists.find(p => p.id === +b.dataset.pl);
    if (!p.ids.includes(addTo.id)) { p.ids.push(addTo.id); await putPl(p); }
    toast(`Ditambahkan ke ${p.name}`);
  }
  render();
};

// ---------- Edit info, cover, lirik ----------
let draft, edUrl;
async function shrink(f) { // foto dari Galeri bisa belasan MB; cover cukup 600px
  try {
    const b = await createImageBitmap(f), s = Math.min(1, 600 / Math.max(b.width, b.height)), c = document.createElement('canvas');
    c.width = b.width * s | 0; c.height = b.height * s | 0;
    c.getContext('2d').drawImage(b, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(r, 'image/jpeg', .85)) || f;
  } catch { return f; }
}
function edShow() {
  URL.revokeObjectURL(edUrl);
  $('#edart').innerHTML = draft.cover ? `<img src="${edUrl = URL.createObjectURL(draft.cover)}" alt="">` : ic('note');
  const l = draft.lyrics ? parseLrc(draft.lyrics) : [];
  $('#edls').textContent = l.length ? `Lirik: ${l.length} baris${l[0].t != null ? ', tersinkron dengan lagu' : ''}` : 'Belum ada lirik';
}
function openEdit(t) {
  const [title, artist] = info(t);
  draft = {t, cover: t.cover || null, lyrics: t.lyrics || null};
  $('#edt').value = title; $('#eda').value = artist; $('#edal').value = t.album || '';
  $('#edmsg').textContent = '';
  edShow(); $('#ed').showModal();
}
async function busy(b, fn) {
  const label = b.textContent;
  b.disabled = true; b.textContent = 'Mencari…'; $('#edmsg').textContent = '';
  try { await fn(); } catch { $('#edmsg').textContent = 'Gagal. Periksa koneksi internet.'; }
  b.disabled = false; b.textContent = label;
}
$('#edimg').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (f) { draft.cover = await shrink(f); edShow(); } };
$('#edrm').onclick = () => { draft.cover = null; edShow(); };
$('#edfind').onclick = e => busy(e.currentTarget, async () => {
  const hit = await lookup($('#edt').value, $('#eda').value);
  if (!hit?.art) { $('#edmsg').textContent = 'Cover tidak ditemukan. Coba perbaiki judul/artis, atau pilih foto.'; return; }
  draft.cover = await getImg(hit.art);
  if (!$('#edal').value && hit.album) $('#edal').value = hit.album;
  edShow();
});
$('#edlfind').onclick = e => busy(e.currentTarget, async () => {
  const l = await fetchLyrics($('#edt').value, $('#eda').value, draft.t === now() ? v.duration : NaN);
  if (l) { draft.lyrics = l; edShow(); } else $('#edmsg').textContent = 'Lirik tidak ditemukan. Coba perbaiki judul/artis.';
});
$('#edlrc').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (f) { draft.lyrics = await f.text(); edShow(); } };
$('#edlrm').onclick = () => { draft.lyrics = null; edShow(); };
$('#edx').onclick = () => $('#ed').close();
$('#eds').onclick = async () => {
  const {t} = draft;
  for (const [k, id] of [['title', '#edt'], ['artist', '#eda'], ['album', '#edal']]) { const x = $(id).value.trim(); if (x) t[k] = x; else delete t[k]; }
  if (draft.cover !== (t.cover || null)) { dropCover(t); if (draft.cover) t.cover = draft.cover; else delete t.cover; }
  if (draft.lyrics !== (t.lyrics || null)) { if (draft.lyrics) t.lyrics = draft.lyrics; else delete t.lyrics; t.lyricsOwn = true; clearSync(t); }
  t.coverTried = t.albumTried = t.lyricsTried = true; // pilihan manual tidak ditimpa pencarian otomatis
  await put(t);
  $('#ed').close();
  render();
  if (t === now()) { showNow(t); if (lyrOn) showLyrics(); }
  toast('Tersimpan');
};

// ---------- Cover & album otomatis (iTunes Search API, gratis) ----------
// Yang dikirim ke Apple hanya judul + artis, bukan lagunya.
async function lookup(title, artist) {
  [title, artist] = [clean(title), clean(artist)];
  const r = await fetch(`https://itunes.apple.com/search?entity=song&limit=5&term=${encodeURIComponent(`${artist} ${title}`.trim())}`);
  if (!r.ok) throw new Error(r.status);
  // hanya terima hasil yang judul (dan artisnya, jika diketahui) cocok, supaya tidak memasang cover lagu lain
  const hit = (await r.json()).results.find(x => sameTitle(title, x.trackName) && (!artist || sameTitle(artist, x.artistName)));
  return hit && {art: hit.artworkUrl100?.replace('100x100bb', '600x600bb'), album: hit.collectionName};
}
async function getImg(u) { const r = await fetch(u); if (!r.ok) throw new Error(r.status); return r.blob(); }
let hunting = false;
async function autoInfo() {
  if (hunting || !navigator.onLine) return;
  hunting = true;
  for (const t of tracks.filter(t => !t.video && ((!t.cover && !t.coverTried) || (!t.album && !t.albumTried)))) {
    try {
      const wantCover = !t.cover && !t.coverTried, hit = await lookup(...info(t));
      const img = wantCover && hit?.art ? await getImg(hit.art) : null;
      if (!tracks.includes(t)) continue; // dihapus saat sedang dicari
      t.coverTried = t.albumTried = true;
      if (img) t.cover = img;
      if (!t.album && hit?.album) t.album = hit.album;
      await put(t);
      if (hit) { render(); if (t === now()) showNow(t); }
    } catch { break; } // jaringan bermasalah: dicoba lagi saat online atau aplikasi dibuka lagi
    await wait(3000); // batas iTunes sekitar 20 permintaan per menit
  }
  hunting = false;
}
addEventListener('online', autoInfo);

// ---------- Tambah berkas ----------
// tanpa atribut accept: iOS sering salah mengenali lagu unduhan dan membuatnya abu-abu, jadi jenis berkas dicek di sini
const MEDIA = /\.(mp3|m4a|m4b|aac|wav|aiff?|caf|flac|alac|ogg|oga|opus|webm|mp4|m4v|mov)$/i;
const isMedia = f => /^(audio|video)\//.test(f.type) || MEDIA.test(f.name);
const baseName = f => f.name.replace(/\.[^.]+$/, '');
const isDup = f => tracks.some(t => t.name === baseName(f) && (t.size == null || t.size === f.size));
console.assert(isMedia({type: '', name: 'a.MP3'}) && !isMedia({type: 'application/pdf', name: 'a.pdf'}), 'isMedia');
async function save(f) {
  const video = f.type.startsWith('video/') || /\.(mp4|mov|m4v)$/i.test(f.name);
  const meta = {name: baseName(f), size: f.size, video, fav: false, ...(video ? {} : await tags(f).catch(() => ({})))};
  const tx = db.transaction(['tracks', 'blobs'], 'readwrite');
  tx.objectStore('tracks').add(meta).onsuccess = e => tx.objectStore('blobs').put(f, meta.id = e.target.result);
  await done(tx);
  return meta;
}
async function addFiles(all) {
  const lrc = all.filter(f => /\.lrc$/i.test(f.name)), media = all.filter(isMedia);
  const other = all.filter(f => !isMedia(f) && !lrc.includes(f)), dups = media.filter(isDup), files = media.filter(f => !dups.includes(f));
  const notes = [];
  if (other.length) notes.push(`Bukan lagu/video, dilewati:\n${other.map(f => f.name).join('\n')}`);
  if (dups.length) notes.push(`Sudah ada di Spotilung, dilewati:\n${dups.map(f => f.name).join('\n')}`);
  const need = files.reduce((s, f) => s + f.size, 0);
  try {
    const {usage, quota} = await navigator.storage.estimate();
    if (need > quota - usage) { alert(`Ruang tidak cukup: perlu ${fmtBytes(need)}, tersisa ${fmtBytes(quota - usage)}. Kosongkan memori iPhone atau hapus beberapa lagu.`); return; }
  } catch {}
  navigator.storage?.persist?.();
  saving = true;
  if (files.length) { $('#empty').hidden = false; $('#empty').textContent = `Menyimpan ${files.length} berkas…`; }
  for (const f of files) {
    try { tracks.push(await save(f)); }
    catch { notes.push(`Gagal menyimpan "${f.name}". Penyimpanan iPhone mungkin penuh.`); break; }
  }
  // berkas .lrc dipasangkan ke lagu dengan nama berkas yang sama
  const orphan = [];
  for (const f of lrc) {
    const t = tracks.find(t => t.name === baseName(f));
    if (t) { t.lyrics = await f.text(); t.lyricsTried = t.lyricsOwn = true; clearSync(t); await put(t); } else orphan.push(f.name);
  }
  if (orphan.length) notes.push(`Lirik tanpa lagu dengan nama sama:\n${orphan.join('\n')}`);
  saving = false;
  if (notes.length) alert(notes.join('\n\n'));
  else if (files.length || lrc.length) toast(`${files.length} lagu${lrc.length ? `, ${lrc.length} lirik` : ''} ditambahkan`);
  render(); storageInfo(); autoInfo();
}
$('#file').onchange = e => { const f = [...e.target.files]; e.target.value = ''; addFiles(f); };

// ---------- Mulai ----------
$('#sort').value = sortBy;
(async () => {
  const r = indexedDB.open('spotilung', 2);
  r.onupgradeneeded = e => {
    const d = r.result;
    if (e.oldVersion < 1) { d.createObjectStore('tracks', {keyPath: 'id', autoIncrement: true}); d.createObjectStore('blobs'); }
    if (e.oldVersion < 2) d.createObjectStore('playlists', {keyPath: 'id', autoIncrement: true});
  };
  db = await req(r);
  [tracks, playlists] = await Promise.all([req(store('tracks').getAll()), req(store('playlists').getAll())]);
  // lanjutkan lagu dan posisi terakhir (tanpa langsung berbunyi)
  queue = (st.q || []).map(byId).filter(Boolean);
  orig = (st.o || []).map(byId).filter(Boolean);
  const last = byId((st.q || [])[st.cur]);
  if (last && queue.includes(last)) load(queue.indexOf(last), false, st.time || 0);
  else { queue = []; orig = []; }
  render(); storageInfo(); autoInfo();
})();
if ('serviceWorker' in navigator) {
  // versi baru sudah terpasang di latar belakang: muat ulang sekali, kecuali sedang memutar atau menyimpan
  const had = navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => had && v.paused && !saving && location.reload());
  navigator.serviceWorker.register('sw.js');
}
